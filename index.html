<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetVax Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="happy.png">
    <meta name="theme-color" content="#4CAF50">
</head>
<body>

    <header>
        <h1>🐾 PetVax Tracker</h1>
    </header>

    <div id="dashboard">
        <div class="dash-controls">
            <button id="addAnimalBtn" class="primary-btn">+ Add New Animal</button>
        </div>

        <div id="petList" class="pet-grid">
            <p id="emptyMsg">No pets added yet. Click above to start!</p>
        </div>
    </div>

    <div id="addPetForm" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Profile</h2>
            
            <label>Type of Animal:</label>
            <select id="petType">
                <option value="Dog" selected>Dog</option>
                <option value="Cat">Cat</option>
                <option value="Cow">Cow</option>
                <option value="Goat">Goat</option>
                <option value="Other">Other</option>
            </select>

            <label>Name:</label>
            <input type="text" id="petName" placeholder="e.g. Tommy">

            <label>Profile Picture:</label>
            <input type="file" id="petPhoto" accept="image/*">
            
            <hr>
            <h3>Vaccination Details</h3>
            
            <label>Last Vaccination Date:</label>
            <input type="date" id="lastVaxDate">

            <label>Next Dose Schedule:</label>
            <select id="reminderType">
                <option value="yearly">Every Year (365 days)</option>
                <option value="custom">Custom Days</option>
                <option value="none">No Future Dose (Just Record)</option>
            </select>

            <div id="customDaysInput" style="display:none;">
                <label>Remind after how many days?</label>
                <input type="number" id="daysCount" placeholder="e.g. 180">
            </div>

            <button id="savePetBtn">Save Profile</button>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-history" style="float:right; font-size:28px; cursor:pointer;">&times;</span>
            <h2>💉 Vaccination History</h2>
            <h3 id="historyPetName" style="color:#666; margin-top:0;"></h3>
            
            <div class="history-input-box">
                <h4>Add Past Record:</h4>
                <input type="text" id="pastVaxName" placeholder="Vaccine Name (e.g. Rabies)">
                <input type="date" id="pastVaxDate">
                <button id="addHistoryBtn" class="secondary-btn">+ Add Record</button>
            </div>

            <div id="historyList" class="history-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
